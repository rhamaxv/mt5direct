[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5direct"
version = "0.3.1"
description = "Standalone MetaTrader 5 client over the native WebSocket protocol. No terminal required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pycryptodome>=3.19",
    "websocket-client>=1.6",
]

[project.urls]
Homepage = "https://github.com/rhamaxv/mt5direct"
Repository = "https://github.com/rhamaxv/mt5direct"
Issues = "https://github.com/rhamaxv/mt5direct/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
pandas = ["pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mt5direct = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
